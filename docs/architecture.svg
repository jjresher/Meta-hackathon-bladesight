<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="BladeSight architecture: photos to SAM 3.1 to measurement to Muse Spark grading to verification to the fleet agent and the web UI" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <style>
      .box{fill:#f3f4f6;stroke:#374151;stroke-width:1.2;rx:8}
      .meta{fill:#e0ecff;stroke:#1d4ed8;stroke-width:1.4;rx:8}
      .t{fill:#111827}.s{fill:#4b5563;font-size:11px}
      .l{stroke:#374151;stroke-width:1.4;fill:none;marker-end:url(#a)}
      @media (prefers-color-scheme: dark){.box{fill:#1f2937;stroke:#9ca3af}.meta{fill:#1e3a8a;stroke:#93c5fd}.t{fill:#f9fafb}.s{fill:#d1d5db}.l{stroke:#9ca3af}}
    </style>
  </defs>
  <rect width="900" height="420" fill="none"/>
  <text x="450" y="24" text-anchor="middle" class="t" font-size="15" font-weight="600">BladeSight: drone photos to a verified repair plan</text>
  <rect class="box" x="20" y="60" width="120" height="70"/><text class="t" x="80" y="90" text-anchor="middle">Drone photos</text><text class="s" x="80" y="108" text-anchor="middle">DTU tiles (dev)</text>
  <rect class="meta" x="170" y="60" width="150" height="70"/><text class="t" x="245" y="86" text-anchor="middle">SAM 3.1</text><text class="s" x="245" y="104" text-anchor="middle">masks from Spark boxes</text><text class="s" x="245" y="118" text-anchor="middle">+ text concepts</text>
  <rect class="box" x="350" y="60" width="130" height="70"/><text class="t" x="415" y="86" text-anchor="middle">Measurement</text><text class="s" x="415" y="104" text-anchor="middle">size, shape, position</text><text class="s" x="415" y="118" text-anchor="middle">(relative, pixels)</text>
  <rect class="meta" x="510" y="60" width="150" height="70"/><text class="t" x="585" y="86" text-anchor="middle">Muse Spark</text><text class="s" x="585" y="104" text-anchor="middle">grades severity 1-5</text><text class="s" x="585" y="118" text-anchor="middle">vs docs/rubric.md</text>
  <rect class="meta" x="690" y="60" width="190" height="70"/><text class="t" x="785" y="86" text-anchor="middle">Verification</text><text class="s" x="785" y="104" text-anchor="middle">second look + rule checks</text><text class="s" x="785" y="118" text-anchor="middle">ok / needs_review / reinspect</text>
  <path class="l" d="M140,95 H170"/><path class="l" d="M320,95 H350"/><path class="l" d="M480,95 H510"/><path class="l" d="M660,95 H690"/>
  <rect class="meta" x="150" y="190" width="300" height="90"/><text class="t" x="300" y="216" text-anchor="middle">Fleet agent (Muse Spark, tool calls)</text><text class="s" x="300" y="236" text-anchor="middle">list_turbines, get_inspection, compare_inspections,</text><text class="s" x="300" y="250" text-anchor="middle">assess_image, create_work_order, request_reinspection,</text><text class="s" x="300" y="264" text-anchor="middle">write_report. Work orders only for verified defects.</text>
  <rect class="box" x="500" y="190" width="170" height="90"/><text class="t" x="585" y="216" text-anchor="middle">Replay store</text><text class="s" x="585" y="236" text-anchor="middle">replay/*.json: inspections,</text><text class="s" x="585" y="250" text-anchor="middle">work orders, report, trace</text><text class="s" x="585" y="264" text-anchor="middle">(model calls cached)</text>
  <rect class="box" x="720" y="190" width="160" height="90"/><text class="t" x="800" y="216" text-anchor="middle">FastAPI</text><text class="s" x="800" y="236" text-anchor="middle">replay mode by default</text><text class="s" x="800" y="250" text-anchor="middle">no key, no live call</text>
  <rect class="box" x="720" y="330" width="160" height="60"/><text class="t" x="800" y="356" text-anchor="middle">Web UI</text><text class="s" x="800" y="374" text-anchor="middle">fleet, inspection, orders, trace</text>
  <path class="l" d="M785,130 V160 H600 V190"/><path class="l" d="M450,235 H500"/><path class="l" d="M670,235 H720"/><path class="l" d="M800,280 V330"/>
  <rect class="box" x="20" y="330" width="420" height="60"/><text class="t" x="230" y="356" text-anchor="middle">Evidence: eval harness on dev, one preregistered held-out run,</text><text class="s" x="230" y="376" text-anchor="middle">severity agreement with the human labels (docs/evidence/)</text>
  <text class="s" x="450" y="410" text-anchor="middle">Blue: Meta models (SAM 3.1, Muse Spark). Everything runs through one client with retries, cache and a spend cap.</text>
</svg>
