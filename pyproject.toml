[project]
name = "bladesight"
version = "0.1.0"
description = "Zero-shot wind turbine blade inspection agent built on Meta SAM 3.1 and Muse Spark"
authors = [{ name = "Juan José (jjresher)" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet==0.49.0",
    "pre-commit==4.7.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.poe.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "pyright"
test = "pytest"
fmt = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]
hooks = "pre-commit install"
secrets-scan = "pre-commit run --all-files"
check = ["lint", "format-check", "typecheck", "test"]
