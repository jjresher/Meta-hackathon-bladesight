# Keep the public demo awake (#14).
#
# Render's Free plan spins a web service down after 15 minutes without inbound traffic and needs
# about a minute to wake (https://render.com/docs/free). This GETs /api/health every 10 minutes
# to keep it warm, but no scheduled run has fired yet (docs/evidence/deploy.md). Notes:
# - Scheduled workflows run only from the default branch (main) and GitHub may delay or skip
#   runs when it is busy, so even when it runs it does not guarantee no cold start.
# - GitHub disables scheduled workflows after 60 days without repository activity.
# - Render grants 750 Free instance hours per workspace per month; one service awake 24/7 uses
#   at most 744 (31 days), so this fits only while it is the workspace's only always-on Free
#   service. Past 750 hours Render suspends every Free service until the next month.
name: keep-alive

on:
  schedule:
    # Off the top of the hour: GitHub's docs call the start of every hour a high-load time, when
    # scheduled runs can be delayed and some queued jobs dropped.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_URL: https://bladesight.onrender.com/api/health
    steps:
      - name: GET /api/health (fails on anything but 200)
        run: |
          set -u
          # A cold instance takes about a minute to wake: up to 5 tries, 90 s each, 15 s apart.
          for attempt in 1 2 3 4 5; do
            started=$(date +%s)
            code=$(curl --silent --show-error --max-time 90 --output body.json \
              --write-out '%{http_code}' "$HEALTH_URL" || true)
            elapsed=$(( $(date +%s) - started ))
            echo "attempt ${attempt}: HTTP ${code} in ${elapsed}s"
            if [ "$code" = "200" ] && grep -q '"status":"ok"' body.json; then
              cat body.json; echo
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          echo "::error::${HEALTH_URL} did not answer 200 with status ok after 5 attempts"
          exit 1
