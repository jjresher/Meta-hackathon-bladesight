# Render blueprint. Replay mode needs no secret: nothing here is a key.
services:
  - type: web
    name: bladesight
    runtime: docker
    plan: free                 # sleeps after ~15 min without traffic, ~1 min to wake (docs/limitations.md)
    healthCheckPath: /api/health
    autoDeployTrigger: commit  # redeploy on every push to the linked branch (current form of the deprecated autoDeploy)
    envVars:
      - key: BLADESIGHT_MODE
        value: replay
